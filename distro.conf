# Distribution identity.
#
# Every user-visible name, path, package name and command in this repository
# is derived from the values below. To rename the distribution, edit this file
# and rebuild; no other file needs to change.
#
# Format: KEY="value" (one per line). The file is sourced by shell scripts and
# parsed by lib/distrokit/branding.py, so keep values literal: no $expansion,
# no command substitution.

# --- Identity --------------------------------------------------------------
DISTRO_NAME="Frontline"
DISTRO_PRETTY_NAME="Frontline Linux"
# Lowercase [a-z0-9-]. Used for paths (/usr/lib/<id>, /etc/<id>), package
# names (<id>-core), the pacman repository and the os-release ID.
DISTRO_ID="frontline"
# Name of the command-line tool installed to /usr/bin.
DISTRO_CLI="frontline"
DISTRO_TAGLINE="A cohesive Arch-based desktop for creators, developers and local AI."
DISTRO_HOME_URL="https://github.com/trail-b1az3r/distro"
DISTRO_DOC_URL="https://github.com/trail-b1az3r/distro/tree/main/docs"
DISTRO_SUPPORT_URL="https://github.com/trail-b1az3r/distro/discussions"
DISTRO_BUG_URL="https://github.com/trail-b1az3r/distro/issues"
DISTRO_GIT_URL="https://github.com/trail-b1az3r/distro"
# Former DISTRO_IDs, space-separated: the distribution was renamed from these. Their packages are replaced by
# this ID's (replaces=), the package repository is also published under their names so their systems still get
# updates, and `<cli> migrate-legacy` (run by a pacman hook) moves pacman.conf, /etc, /var/lib, units, the login
# and boot themes and the users' own folders over to this ID.
DISTRO_LEGACY_IDS="nexora"
# os-release ID_LIKE. Keep "arch" so tools that check for Arch keep working.
DISTRO_ID_LIKE="endeavouros arch"

# --- ISO ---------------------------------------------------------------------
# The release version is the build date in ISO_VERSION_FORMAT (date(1)),
# then ISO_RELEASE: 26.11.0.2.1 is release 0.2.1 of November 2026. The ISO
# file is <DISTRO_NAME>-<version>-x86_64.iso, the tag v<version>, and the
# release is titled <DISTRO_PRETTY_NAME> <version> "<ISO_CODENAME>".
ISO_VERSION_FORMAT="%y.%m"
ISO_RELEASE="0.2.1"
ISO_CODENAME="Rain Field"
ISO_LABEL_PREFIX="FRONTLINE"
ISO_PUBLISHER="Frontline Linux <https://github.com/trail-b1az3r/distro>"
ISO_APPLICATION="Frontline Linux Live/Installer"
# Name of the live session account.
LIVE_USER="liveuser"
LIVE_HOSTNAME="frontline-live"

# --- Brand colours (used by the installer, boot splash, GRUB, SDDM) ---------
# Taken from the logo (branding/logo): graphite paper, the slate blue and sage of its washes.
BRAND_BG="#0E1013"
BRAND_SURFACE="#1A1D22"
BRAND_FG="#ECEEF0"
BRAND_MUTED="#8E949C"
BRAND_ACCENT="#5E7A96"
BRAND_ACCENT_2="#8FA7A0"
BRAND_WARNING="#FFB547"
BRAND_DANGER="#FF5C7A"

# --- Package repository ------------------------------------------------------
# The distribution's own pacman repository, which carries the <id>-* packages
# and prebuilt AUR dependencies of the desktop. Leave DISTRO_REPO_SERVER empty
# to install without it (packages then come only from the ISO's offline repo).
# Where `<cli> logs send` files diagnostic logs (owner/repository on GitHub),
# when the user has turned log sharing on (off by default; logs otherwise stay
# on the computer). Empty: logs cannot be sent.
DISTRO_LOG_REPO=""
DISTRO_REPO_NAME="frontline"
DISTRO_REPO_SERVER="https://github.com/trail-b1az3r/distro/releases/download/repo"
# When DISTRO_REPO_KEY_ID is set, packages must be signed by it. Without a
# key, the repository is trusted over HTTPS only (documented in docs/packaging.md).
DISTRO_REPO_KEY_ID=""
DISTRO_REPO_SIGLEVEL_UNSIGNED="Optional TrustAll"

# --- Default applications ----------------------------------------------------
# The code editor, by id from packages/editors.toml. "frontline-code" is the
# built-in Frontline Code (VSCodium, MIT, themed and set up for Frontline;
# packages/pkgbuild/frontline-code). Alternatives there: code (Arch's Code - OSS),
# vscodium-bin, and visual-studio-code-bin, which is installed online because
# its licence does not allow redistribution.
CODE_EDITOR="frontline-code"
# The browser: OyNIx (https://github.com/trail-b1az3r/OyNIx), from its AUR package oynix-bin (built into
# the distribution repository with the other AUR packages).
BROWSER="oynix-bin"
