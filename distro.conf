# Distribution identity.
#
# Every user-visible name, path, package name and command in this repository
# is derived from the values below. To rename the distribution, edit this file
# and rebuild; no other file needs to change.
#
# Format: KEY="value" (one per line). The file is sourced by shell scripts and
# parsed by lib/distrokit/branding.py, so keep values literal: no $expansion,
# no command substitution.

# --- Identity --------------------------------------------------------------
DISTRO_NAME="Nexora"
DISTRO_PRETTY_NAME="Nexora Linux"
# Lowercase [a-z0-9-]. Used for paths (/usr/lib/<id>, /etc/<id>), package
# names (<id>-core), the pacman repository and the os-release ID.
DISTRO_ID="nexora"
# Name of the command-line tool installed to /usr/bin.
DISTRO_CLI="nexora"
DISTRO_TAGLINE="A cohesive Arch-based desktop for creators, developers and local AI."
DISTRO_HOME_URL="https://github.com/trail-b1az3r/distro"
DISTRO_DOC_URL="https://github.com/trail-b1az3r/distro/tree/main/docs"
DISTRO_SUPPORT_URL="https://github.com/trail-b1az3r/distro/discussions"
DISTRO_BUG_URL="https://github.com/trail-b1az3r/distro/issues"
DISTRO_GIT_URL="https://github.com/trail-b1az3r/distro"
# os-release ID_LIKE. Keep "arch" so tools that check for Arch keep working.
DISTRO_ID_LIKE="endeavouros arch"

# --- ISO ---------------------------------------------------------------------
# Release version format passed to date(1); the ISO file is
# <DISTRO_NAME>-<version>-x86_64.iso.
ISO_VERSION_FORMAT="%Y.%m"
ISO_LABEL_PREFIX="NEXORA"
ISO_PUBLISHER="Nexora Linux <https://github.com/trail-b1az3r/distro>"
ISO_APPLICATION="Nexora Linux Live/Installer"
# Name of the live session account.
LIVE_USER="liveuser"
LIVE_HOSTNAME="nexora-live"

# --- Brand colours (used by the installer, boot splash, GRUB, SDDM) ---------
BRAND_BG="#0B0E1A"
BRAND_SURFACE="#151A2C"
BRAND_FG="#E8ECF8"
BRAND_MUTED="#8A93B2"
BRAND_ACCENT="#7C6CFF"
BRAND_ACCENT_2="#23D5C4"
BRAND_WARNING="#FFB547"
BRAND_DANGER="#FF5C7A"

# --- Package repository ------------------------------------------------------
# The distribution's own pacman repository, which carries the <id>-* packages
# and prebuilt AUR dependencies of the desktop. Leave DISTRO_REPO_SERVER empty
# to install without it (packages then come only from the ISO's offline repo).
DISTRO_REPO_NAME="nexora"
DISTRO_REPO_SERVER="https://github.com/trail-b1az3r/distro/releases/download/repo"
# When DISTRO_REPO_KEY_ID is set, packages must be signed by it. Without a
# key, the repository is trusted over HTTPS only (documented in docs/packaging.md).
DISTRO_REPO_KEY_ID=""
DISTRO_REPO_SIGLEVEL_UNSIGNED="Optional TrustAll"

# --- Default applications ----------------------------------------------------
# The code editor package. "code" is Arch's MIT-licensed Code - OSS build and
# can be redistributed on the ISO. Alternatives listed in
# packages/editors.toml (vscodium-bin, visual-studio-code-bin) are installed
# online when their licence does not allow redistribution.
CODE_EDITOR="code"
BROWSER="firefox"
