# touchD Surface Pro 5 profile for iptsd 3.x.
# Install with: sudo touchdctl profile surface-pro-5

[Touchscreen]
# Reject contacts classified as palms. Pen proximity does not disable fingers.
DisableOnPalm = true
DisableOnStylus = false
Overshoot = 0.35

[Contacts]
# Slightly wider contact bounds help recover angled finger contacts.
SizeMin = 0.15
SizeMax = 2.2
AspectMin = 0.8
AspectMax = 2.8
PositionThresholdMin = 0.03
PositionThresholdMax = 2.5

[Stylus]
TipDistance = 0

[DFT]
# Reduce spurious pen side-button detections.
ButtonMinMag = 4000
