# touchD Surface Pro 5 profile for iptsd 3.x.
# Install with: sudo touchdctl profile surface-pro-5

[Touchscreen]
# Palms are rejected contact by contact (iptsd always does); a palm on the screen does not switch off the
# fingers too, which with angled fingers read as large contacts made touch stop working. Pen proximity does not
# disable fingers either.
DisableOnPalm = false
DisableOnStylus = false
Overshoot = 0.35

[Contacts]
# Slightly wider contact bounds help recover angled finger contacts.
SizeMin = 0.15
SizeMax = 2.2
AspectMin = 1.0
AspectMax = 2.8
PositionThresholdMin = 0.03
PositionThresholdMax = 2.5

[Stylus]
TipDistance = 0

[DFT]
# Reduce spurious pen side-button detections.
ButtonMinMag = 4000
