# Pinned inputs of the ISO build host (sourced by scripts/bootstrap.sh).
#
# EndeavourOS keyring and mirror list, fetched from EndeavourOS's GitHub
# repositories at fixed commits and checked against these SHA-256 sums, so an
# Arch Linux build host (or container) can trust the [endeavouros] repository.
# Update with `scripts/update-pins.sh` and review the diff.

EOS_KEYRING_REPO="https://raw.githubusercontent.com/endeavouros-team/keyring"
EOS_KEYRING_COMMIT="d22ccf0773e93cb9f0b1ab725319ca9aa985d27f"
EOS_KEYRING_GPG_SHA256="856fce9559417aa220729a9e4d0afd6a7b8ee17b13460475fcb58735c960a97f"
EOS_KEYRING_TRUSTED_SHA256="3db0fbb91b824033143e4adfde512826b8eedc59f91fc89e1c95ca02bcf4a508"
EOS_KEYRING_REVOKED_SHA256="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

EOS_MIRRORLIST_REPO="https://raw.githubusercontent.com/endeavouros-team/PKGBUILDS"
EOS_MIRRORLIST_COMMIT="c5d49b7a149170d82d96b46b6bd227ac684f189e"
EOS_MIRRORLIST_SHA256="3cadc9390c4ccccc6a68fdd99a50d2978284cdcfa0a1e7123b1485ac14fceada"

# Container image for `build.sh --container`. For bit-for-bit rebuilds pin a
# digest (docker.io/archlinux/archlinux@sha256:...) together with ARCHIVE_DATE.
BUILD_IMAGE="docker.io/archlinux/archlinux:base-devel"
