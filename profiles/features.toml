# Features that installation profiles switch on or off. Every profile can be
# customised in the installer, feature by feature.
#
# kind = "bool"   -> on/off; `lists` are installed when on.
# kind = "choice" -> one of `choices`; each choice names the lists it installs.
# `group` and `order` arrange the installer's customisation page.

[desktop_environment]
kind = "choice"
group = "Desktop"
order = 1
label = "Primary desktop"
description = "Choose the primary external desktop profile. Halcyon is retained as the bootstrap and fallback session; additional profiles can be selected separately."
default = "halcyon"
[desktop_environment.choices]
halcyon = ["desktop-halcyon"]
ml4w = ["desktop-halcyon", "desktop-ml4w"]
sekaipop = ["desktop-halcyon", "desktop-sekaipop"]
hyde = ["desktop-halcyon", "desktop-hyde"]

[desktop_ml4w]
kind = "bool"
group = "Desktop"
order = 2
label = "Also install ML4W"
description = "Install ML4W as an additional Hyprland configuration. Its upstream setup can change shared themes and login settings."
lists = ["desktop-ml4w"]

[desktop_sekaipop]
kind = "bool"
group = "Desktop"
order = 3
label = "Also install SekaiPop"
description = "Install SekaiPop as an additional Quickshell desktop configuration."
lists = ["desktop-sekaipop"]

[desktop_hyde]
kind = "bool"
group = "Desktop"
order = 4
label = "Also install HyDE"
description = "Install HyDE as an additional Hyprland configuration. Its upstream installer may change shared system settings."
lists = ["desktop-hyde"]

[apps]
kind = "bool"
group = "Applications"
order = 10
label = "Desktop applications"
description = "Ark (archives), Gwenview (images), Okular (PDF), Haruna/mpv (media) and Flatpak."
lists = ["apps"]

[browser]
kind = "bool"
group = "Applications"
order = 20
label = "Web browser"
description = "Firefox, configured as the default browser."
lists = ["browser"]

[office]
kind = "bool"
group = "Applications"
order = 30
label = "OnlyOffice"
description = "Documents, spreadsheets and presentations, compatible with Microsoft Office formats."
lists = ["office"]

[plasma_fallback]
kind = "bool"
group = "Applications"
order = 40
label = "KDE Plasma fallback session"
description = "A second, conventional desktop you can pick at the login screen (Wayland; X11 apps run through XWayland)."
lists = ["plasma-fallback"]

[dev_basic]
kind = "bool"
group = "Developer tools"
order = 10
label = "Developer utilities"
description = "Python, Node.js, npm, uv, GitHub CLI, ripgrep, fzf, tmux and friends. Git, Fish and yay are always installed."
lists = ["dev-basic"]

[code_editor]
kind = "bool"
group = "Developer tools"
order = 20
label = "Code editor"
description = "A VS Code-compatible editor (see packages/editors.toml)."
lists = []

[dev_full]
kind = "bool"
group = "Developer tools"
order = 30
label = "Compilers and debuggers"
description = "GCC, Clang/LLVM, Rust, CMake, Meson, GDB, LLDB, Valgrind, strace and kernel headers."
lists = ["dev-full"]

[containers]
kind = "choice"
group = "Developer tools"
order = 40
label = "Containers"
description = "Rootless Podman (recommended) or Docker."
default = "none"
[containers.choices]
none = []
podman = ["containers-podman"]
docker = ["containers-docker"]

[claude_code]
kind = "bool"
group = "Developer tools"
order = 50
label = "Claude Code"
description = "Anthropic's coding agent, available as `claude` in every shell. Installed online for your user."
lists = []
requires_network = true

[hypernix]
kind = "bool"
group = "AI"
order = 10
label = "HyperNix"
description = "Local model toolkit: chat, GGUF conversion, quantisation and training, with automatic CUDA/ROCm/CPU selection."
lists = ["ai"]
requires_network = true

[assistant]
kind = "choice"
group = "AI"
order = 20
label = "AI assistant"
description = "Hermis (Hermes Agent by Nous Research), OpenClaw, both or none."
default = "none"
requires_network = true
[assistant.choices]
none = []
hermis = ["ai"]
openclaw = ["ai"]
both = ["ai"]

[gpu_compute]
kind = "bool"
group = "AI"
order = 30
label = "GPU compute toolkits"
description = "CUDA on NVIDIA, ROCm/HIP on supported AMD GPUs, oneAPI Level Zero on Intel Arc. Large (several GB)."
lists = []

[snapshots]
kind = "bool"
group = "System"
order = 10
label = "Btrfs snapshots"
description = "Automatic snapshots before and after every pacman transaction, bootable from GRUB. Btrfs only."
lists = ["snapshots"]

[network_manager]
kind = "choice"
group = "System"
order = 10
label = "Network manager"
description = "NetworkManager, the usual one; or nmx, Nexora's own (nmcli-compatible, Wi-Fi back after every suspend, enterprise Wi-Fi with automatic certificates). Both are installed: switch later with `sudo systemctl enable --now nmx`."
default = "networkmanager"
[network_manager.choices]
networkmanager = []
nmx = []

[networkmanager_assist]
kind = "bool"
group = "System"
order = 25
label = "NetworkManager smart assist (nmx)"
description = "Keep NetworkManager in control, while nmx watches for captive portals and enables system CA trust on saved 802.1X profiles without a CA. Does not take over network devices."
lists = []

[firewall]
kind = "bool"
group = "System"
order = 20
label = "Firewall"
description = "An nftables ruleset that blocks unsolicited incoming connections. No background daemon."
lists = ["firewall"]
