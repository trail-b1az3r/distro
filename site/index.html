<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%DISTRO_PRETTY_NAME%</title>
    <meta name="description" content="%DISTRO_TAGLINE%" />
    <meta name="theme-color" content="#4a3fb4" />
    <meta property="og:title" content="%DISTRO_PRETTY_NAME%" />
    <meta property="og:description" content="%DISTRO_TAGLINE%" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%FAVICON%" />
    <script>
      // The saved light/dark choice, before the page paints (light otherwise).
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
