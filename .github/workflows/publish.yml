# Publish an ISO an earlier Release or ISO run built and tested, without
# building it again. The one-off push trigger publishes the 26.10.0.1.2 ISO
# artifact from ISO workflow run 41148720168; normal manual publishing remains
# available through workflow_dispatch.
name: Publish

on:
  push:
    branches: [publish-26.10.0.1.2]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the run that built the ISO (from its URL)"
        required: true
      tag:
        description: "Tag to publish it as, e.g. v26.10.0.1.0"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib python
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: iso
          run-id: ${{ inputs.run_id || '41148720168' }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: build/repo
          run-id: ${{ inputs.run_id || '41148720168' }}
          github-token: ${{ github.token }}
      - name: Publish the release and the package repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ inputs.tag || 'v26.10.0.1.2' }}
        run: |
          git config --global --add safe.directory "$PWD"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" || true
          scripts/publish-release.sh --tag "$TAG"
      - name: Remove the temporary publish trigger branch
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/publish-26.10.0.1.2"
