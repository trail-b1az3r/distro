# Tag v<version>[.N] -> build and test the ISO, publish it as a GitHub release,
# and update the package repository installed systems use (release "repo").
# Or run it by hand (Actions > Release > Run workflow) with a tag name: the
# same, and the tag is created on the commit it ran on once the ISO passes.
# A tag pushed by `./build.sh --publish` (scripts/publish-release.sh) comes
# with its release and ISO already uploaded: nothing is rebuilt then.
# See docs/release-process.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v26.10.0.1.0 (on the commit this runs on)"
        required: true

permissions:
  contents: write
  actions: read  # iso.yml's QEMU job downloads artifacts through the API

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.release.outputs.published }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Is the release already published (from build.sh --publish)?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" == v* ]] || TAG="v$TAG"  # 26.10.0.1.0 -> v26.10.0.1.0
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Drafts too: build.sh uploads to a draft, pushes the tag, then publishes it.
          assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name")"
          if grep -qE '\.iso(\.part-00)?$' <<<"$assets"; then
            echo "Release $TAG already carries an ISO: not rebuilding it."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  iso:
    needs: check
    if: needs.check.outputs.published != 'true'
    uses: ./.github/workflows/iso.yml
    with:
      profile: standard
      offline: minimal
      qemu: true
    secrets: inherit

  publish:
    needs: [check, iso]
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib python
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: build/repo
      - name: Publish the release and the package repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config --global --add safe.directory "$PWD"
          # A run by hand creates the tag (publish-release.sh pushes it).
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tag goes up with git first: the releases API refuses to create
          # a tag with the workflow's token (403 "Resource not accessible by
          # integration"), while a git push of the tag is allowed.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            name="$(. ./distro.conf && echo "$DISTRO_PRETTY_NAME")"
            git tag -a "$TAG" -m "$name ${TAG#v}" HEAD
            git push origin "refs/tags/$TAG"
          fi
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/publish-release.sh --tag "$TAG"
