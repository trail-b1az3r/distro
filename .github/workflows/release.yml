# Tag vYYYY.MM[.N] -> build and test the ISO, publish it as a GitHub release,
# and update the package repository installed systems use (release "repo").
# A tag pushed by `./build.sh --publish` (scripts/publish-release.sh) comes
# with its release and ISO already uploaded: nothing is rebuilt then.
# See docs/release-process.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read  # iso.yml's QEMU job downloads artifacts through the API

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Is the release already published (from build.sh --publish)?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafts too: build.sh uploads to a draft, pushes the tag, then publishes it.
          assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .assets[].name")"
          if grep -qE '\.iso(\.part-00)?$' <<<"$assets"; then
            echo "Release $GITHUB_REF_NAME already carries an ISO: not rebuilding it."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  iso:
    needs: check
    if: needs.check.outputs.published != 'true'
    uses: ./.github/workflows/iso.yml
    with:
      profile: standard
      offline: minimal
      qemu: true
    secrets: inherit

  publish:
    needs: iso
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib python
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: build/repo
      - name: Publish the release and the package repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/publish-release.sh --tag "$GITHUB_REF_NAME"
