# Lint, unit/GUI/integration tests, and the distribution's packages built and
# tested on Arch Linux. The full ISO build is in iso.yml.
name: CI

on:
  push:
    branches: [main, beta, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      reuse_last_arch_packages:
        description: "Reuse the latest successful CI run's Arch package artifact and only publish/check the upload"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_last_arch_packages != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck fish
          pip install ruff==0.15.8
      - name: Static checks
        run: scripts/check.sh

  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_last_arch_packages != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies (Qt offscreen, rsvg for artwork)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 fonts-dejavu-core librsvg2-bin
          pip install pytest pyside6 pillow numpy
      - name: Unit and GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/unit tests/gui
      - name: Partitioning on loop devices (root)
        run: sudo -E env "PATH=$PATH" python -m pytest tests/integration
      - name: Artwork generation
        run: PYTHONPATH=lib python -m distrokit.build.branding


  write-rust:
    name: Nexora Write Rust backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust backend tests
        run: cargo test --manifest-path apps/write/backend/Cargo.toml

  arch:
    outputs:
      package_build_success: ${{ steps.build_iso_packages.outcome }}
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_last_arch_packages != true
    name: Arch Linux packages
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Git for the checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build host
        run: scripts/bootstrap.sh --container
      - name: Unit tests on Arch
        run: python -m pytest tests/unit
      - name: Build the distribution's packages (runs their check())
        run: |
          PYTHONPATH=lib python -m distrokit.build.packages render --out build/pkgbuild
          # Bump every local package snapshot above the stable release package,
          # not just the core package: this includes hyprland-plus.
          sed -i "s/^pkgrel=.*/pkgrel=${GITHUB_RUN_NUMBER}/" build/pkgbuild/*/PKGBUILD
          chown -R builder build
          for dir in build/pkgbuild/*/; do
            case "$dir" in */python315-pip/|*/write/|*/touchd-dkms/) continue ;; esac
            (cd "$dir" && runuser -u builder -- makepkg --syncdeps --noconfirm --cleanbuild)
          done
          # Keep them for the experiments sources now: scripts/build-packages.sh (the steps below) re-renders
          # build/pkgbuild and deletes every package directory first.
          mkdir -p build/ci-packages
          cp -t build/ci-packages -- build/pkgbuild/*/*.pkg.tar.zst
      - name: Install them
        run: pacman -U --noconfirm build/pkgbuild/distro/*-core-*.pkg.tar.zst build/pkgbuild/distro/*-branding-*.pkg.tar.zst
      - name: Installed CLI works
        run: |
          id="$(. ./distro.conf && echo "$DISTRO_ID")"
          cli="$(. ./distro.conf && echo "$DISTRO_CLI")"
          "$cli" --version
          "$cli" hardware
          "$id-gpu" detect
          distro-gpu status || true
          grep "ID=\"$id\"" /usr/lib/os-release
      - name: Dependency plan (AUR resolution)
        run: BUILD_USER=builder scripts/build-packages.sh --plan
      - name: Build packages the way the ISO build does, in its chroot (an AUR package with a signed source, a local one)
        id: build_iso_packages
        run: |
          rm /etc/sudoers.d/90-builder
          pacman -Qq > /tmp/before
          id="$(. ./distro.conf && echo "$DISTRO_ID")"
          BUILD_USER=builder scripts/build-packages.sh --only touchd-dkms wlogout "$id-fonts-google-sans-flex"
          ls -l build/repo
          pacman --config build/packages/pacman-build.conf -Sl "$(. ./distro.conf && echo "$DISTRO_REPO_NAME")"
          pacman -Qq > /tmp/after
          if ! diff /tmp/before /tmp/after; then echo "the build changed the host's packages"; exit 1; fi
          if findmnt -rn -o TARGET | grep -F "$PWD/build/packages/chroot"; then echo "left mounted"; exit 1; fi
      - name: Collect built package archives
        run: |
          mkdir -p build/ci-packages
          find build -type f -name '*.pkg.tar.zst' \
            ! -path 'build/ci-packages/*' \
            ! -path 'build/packages/chroot/*' \
            -exec cp -n -t build/ci-packages -- {} +
          count="$(find build/ci-packages -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)"
          id="$(. ./distro.conf && echo "$DISTRO_ID")"
          for own in "$id-core" nmx hyprland-plus; do
            if ! compgen -G "build/ci-packages/$own-[0-9]*.pkg.tar.zst" >/dev/null; then
              echo "::error::The distribution's own package $own was not collected for the experiments sources."
              ls build/ci-packages
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No package archives were collected. Build output locations:"
            find build -maxdepth 4 -type d -print
            exit 1
          fi
          pacman -S --noconfirm --needed namcap
          namcap build/ci-packages/*.pkg.tar.zst || true
          echo "Collected $count package archives for downstream jobs."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: |
            build/ci-packages/*.pkg.tar.zst
            packages/aur.lock.json
          if-no-files-found: ignore
      - name: Show a newly written AUR lock (commit it to pin the AUR packages)
        run: |
          if [ -f packages/aur.lock.json ] && ! git ls-files --error-unmatch packages/aur.lock.json >/dev/null 2>&1; then
            echo "::notice::packages/aur.lock.json was generated by this run; commit it (also in the 'packages' artifact)."
            cat packages/aur.lock.json
          fi
  # main -> nexora-experiments; beta and claude/** -> nexora-experiments-extra (beta distro files).
  publish-experiments:
    name: Publish ${{ github.ref == 'refs/heads/main' && 'nexora-experiments' || 'nexora-experiments-extra' }} pacman source
    needs: [arch]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) &&
      (
        inputs.reuse_last_arch_packages == true ||
        needs.arch.outputs.package_build_success == 'success'
      )
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
      actions: read
    # One publish per source at a time; a newer build replaces a queued older one.
    concurrency:
      group: publish-${{ github.ref == 'refs/heads/main' && 'nexora-experiments' || 'nexora-experiments-extra' }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.ref == 'refs/heads/main' && 'nexora-experiments' || 'nexora-experiments-extra' }}
    steps:
      - name: Install publishing tools
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib python zstd
      - uses: actions/checkout@v4
      - name: Find latest successful Arch package artifact
        id: previous
        if: inputs.reuse_last_arch_packages == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=50" --jq '.workflow_runs[].id')"
          selected=""
          for run_id in $runs; do
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            # The workflow can be red because of unrelated lint/tests or a
            # later Arch validation. Reuse only when the actual package build
            # step succeeded and its artifact still exists.
            build_result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Arch Linux packages") | .steps[] | select(.name == "Build packages the way the ISO build does, in its chroot (an AUR package with a signed source, a local one)") | .conclusion] | first // empty')"
            [ "$build_result" = "success" ] || continue
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.name == "packages" and .expired == false) | .id' | head -n1)"
            if [ -n "$artifact_id" ]; then
              selected="$run_id"
              echo "Found package-build-success artifact in run $run_id (artifact $artifact_id; overall workflow status is irrelevant)."
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::No unexpired package artifact with a successful Arch package-build step found in the last 50 completed CI runs on main."
            exit 1
          fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: inputs.reuse_last_arch_packages == true
        with:
          name: packages
          path: build/pkgbuild
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.reuse_last_arch_packages != true
        with:
          name: packages
          path: build/pkgbuild
      - name: Verify package artifact
        run: |
          count="$(find build/pkgbuild -type f -name '*.pkg.tar.zst' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::The selected packages artifact contains no Arch package archives."
            find build/pkgbuild -maxdepth 3 -type f -print
            exit 1
          fi
          echo "Verified $count Arch package archives for publication."
      - name: Assemble repository files
        run: |
          mkdir -p build/experiments-input
          find build/pkgbuild -type f -name '*.pkg.tar.zst' -exec cp -t build/experiments-input -- {} +
          test -n "$(find build/experiments-input -name '*.pkg.tar.zst' -print -quit)"
          bash -x scripts/publish-repo.sh build/experiments-input build/experiments-assets "$REPO"
          python scripts/experiments-manifest.py build/experiments-input build/experiments-assets/packages.json \
            --repo "$REPO" --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish rolling experimental repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release view consults git metadata; this job runs inside a container,
          # where checkout's safe.directory setting may not be present.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$REPO" = nexora-experiments ]; then
            title="Nexora Experimental Packages"
            notes="Rolling pacman repository built from the latest successful CI run on main. Opt in per component: sudo nexora experiments enable <component>."
          else
            title="Nexora Experimental Packages: extra (beta)"
            notes="Beta distro files: a rolling pacman repository built from the latest successful CI run of a development branch ($GITHUB_REF_NAME at ${GITHUB_SHA::7}). Opt in per component: sudo nexora experiments enable <component> --extra."
          fi
          if ! gh release view "$REPO" >/dev/null 2>&1; then
            gh release create "$REPO" --title "$title" --notes "$notes" --prerelease --latest=false
          else
            gh release edit "$REPO" --notes "$notes"
          fi
          gh release upload "$REPO" build/experiments-assets/* --clobber
