# nexora-msg: the Rust store and the Python app tested on Python 3.14 and 3.15, and the iPhone companion app built
# as an unsigned IPA (for sideloading) and published to the "nexora-msg-ios" release.
name: nexora-msg

on:
  push:
    branches: [main]
    paths: [apps/msg/**, packages/pkgbuild/nexora-msg/**, .github/workflows/msg.yml]
  pull_request:
    paths: [apps/msg/**, packages/pkgbuild/nexora-msg/**, .github/workflows/msg.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Store and app (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Rust tests
        working-directory: apps/msg/core
        run: cargo test --locked && cargo build --locked --release
      - name: Python tests
        working-directory: apps/msg
        env:
          NEXORA_MSG_CORE: ${{ github.workspace }}/apps/msg/core/target/release/nexora-msg-core
        run: |
          python -m pip install --quiet pytest cryptography
          python -W error::SyntaxWarning -m pytest -q tests

  ios:
    name: iPhone companion app (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Build
        run: apps/msg/ios/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: NexoraMessages-ipa
          path: ${{ runner.temp }}/ipa/NexoraMessages.ipa
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Nexora Messages, the iPhone companion app for nexora-msg. Unsigned: install it with SideStore, AltStore or Sideloadly, which sign it with your Apple ID."
          gh release view nexora-msg-ios >/dev/null 2>&1 || \
            gh release create nexora-msg-ios --title "Nexora Messages for iPhone" --notes "$notes" --prerelease --latest=false
          gh release upload nexora-msg-ios "$RUNNER_TEMP/ipa/NexoraMessages.ipa" --clobber
