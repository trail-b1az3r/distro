# frontline-msg: the Rust store and the Python app tested on Python 3.14 and 3.15, and the iPhone companion app built
# as an unsigned IPA (for sideloading) and published to the "frontline-msg-ios" release.
name: frontline-msg

on:
  push:
    branches: [main]
    paths: [apps/msg/**, apps/rdp-express/**, packages/pkgbuild/msg/**, packages/pkgbuild/rdp-express/**, .github/workflows/msg.yml]
  pull_request:
    paths: [apps/msg/**, apps/rdp-express/**, packages/pkgbuild/msg/**, packages/pkgbuild/rdp-express/**, .github/workflows/msg.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Store and app (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Rust tests
        working-directory: apps/msg/core
        run: cargo test --locked && cargo build --locked --release
      - name: rdp-express tests
        working-directory: apps/rdp-express
        run: cargo test --locked
      - name: Python tests
        working-directory: apps/msg
        env:
          FRONTLINE_MSG_CORE: ${{ github.workspace }}/apps/msg/core/target/release/frontline-msg-core
        run: |
          # Qt GUI's own libraries (PySide6's wheels do not carry them), for the viewer's key test.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
          python -m pip install --quiet pytest cryptography
          python -m pip install --quiet PySide6 || echo "::notice::no PySide6 for Python ${{ matrix.python }} yet: its test is skipped"
          QT_QPA_PLATFORM=offscreen python -W error::SyntaxWarning -m pytest -q tests

  ios:
    name: iPhone companion app (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Build
        run: apps/msg/ios/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: FrontlineMessages-ipa
          path: ${{ runner.temp }}/ipa/FrontlineMessages.ipa
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Frontline Messages, the iPhone companion app for frontline-msg. Unsigned: install it with SideStore, AltStore or Sideloadly, which sign it with your Apple ID."
          gh release view frontline-msg-ios >/dev/null 2>&1 || \
            gh release create frontline-msg-ios --title "Frontline Messages for iPhone" --notes "$notes" --prerelease --latest=false
          gh release upload frontline-msg-ios "$RUNNER_TEMP/ipa/FrontlineMessages.ipa" --clobber
