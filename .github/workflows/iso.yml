# Build the ISO in an Arch Linux container and install it in QEMU/KVM.
# Runs weekly, on demand, and from release.yml for tags.
name: ISO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/iso.yml"
      - "build.sh"
      - "iso/**"
      - "lib/distrokit/build/iso.py"
      - "packages/**"
      - "tests/unit/test_iso.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/iso.yml"
      - "build.sh"
      - "iso/**"
      - "lib/distrokit/build/iso.py"
      - "packages/**"
      - "tests/unit/test_iso.py"
  workflow_dispatch:
    inputs:
      edition:
        description: ISO edition
        type: choice
        options: [standard, nano]
        default: standard
      compression:
        description: SquashFS preset (auto selects by edition)
        type: choice
        options: [auto, release, nano]
        default: auto
      profile:
        description: Default installation profile
        type: choice
        options: [standard, minimal, developer, ai]
        default: standard
      offline:
        description: Offline repository on the ISO
        type: choice
        options: [minimal, full]
        default: minimal
      qemu:
        description: Install the ISO in QEMU and check it
        type: boolean
        default: true
      iso_run:
        description: Skip the build and test the ISO of this earlier run (its ID)
        type: string
        default: ""
  workflow_call:
    inputs:
      edition:
        type: string
        default: standard
      compression:
        type: string
        default: auto
      profile:
        type: string
        default: standard
      offline:
        type: string
        default: minimal
      qemu:
        type: boolean
        default: true
    secrets:
      GPG_PRIVATE_KEY:
        required: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read  # the QEMU job may test an earlier run's ISO

jobs:
  build:
    if: ${{ !inputs.iso_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EDITION: ${{ inputs.edition || (github.event_name == 'pull_request' && 'nano' || 'standard') }}
      COMPRESSION: ${{ inputs.compression || 'auto' }}
      PROFILE: ${{ (inputs.edition == 'nano' || github.event_name == 'pull_request') && 'minimal' || (inputs.profile || 'standard') }}
      OFFLINE: ${{ inputs.offline || 'minimal' }}
    steps:
      - name: Free disk space (the full offline build needs ~60 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPGKEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build
        run: ./build.sh --container --edition "$EDITION" --compression "$COMPRESSION" --profile "$PROFILE" --offline "$OFFLINE"
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            dist/*.iso
            checksums/
            metadata/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: build/repo/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aur-lock
          path: packages/aur.lock.json
          if-no-files-found: ignore

  qemu:
    needs: build
    if: ${{ !cancelled() && (inputs.qemu != false || github.event_name == 'pull_request') && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.iso_run)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EDITION: ${{ inputs.edition || (github.event_name == 'pull_request' && 'nano' || 'standard') }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ (inputs.edition == 'nano' || github.event_name == 'pull_request') && fromJSON('["uefi-btrfs-encrypted", "bios-ext4-grub", "live-uefi-usb", "live-uefi-cdrom"]') || fromJSON('["uefi-btrfs-encrypted", "bios-ext4-grub", "uefi-offline-developer", "live-uefi-usb", "live-uefi-cdrom"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf xorriso
      - uses: actions/download-artifact@v4
        with:
          name: iso
          run-id: ${{ inputs.iso_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install and check (${{ matrix.scenario }})
        run: python3 tests/qemu/qemu_test.py --iso dist/*.iso --edition "$EDITION" --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-${{ matrix.scenario }}
          path: |
            build/qemu/**/*.log
            build/qemu/**/*.json
          if-no-files-found: ignore
