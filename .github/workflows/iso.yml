# Build the ISO in an Arch Linux container and install it in QEMU/KVM.
# Runs weekly, on demand, and from release.yml for tags.
name: ISO

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Default installation profile
        type: choice
        options: [standard, minimal, developer, ai]
        default: standard
      offline:
        description: Offline repository on the ISO
        type: choice
        options: [minimal, full]
        default: minimal
      qemu:
        description: Install the ISO in QEMU and check it
        type: boolean
        default: true
  workflow_call:
    inputs:
      profile:
        type: string
        default: standard
      offline:
        type: string
        default: minimal
      qemu:
        type: boolean
        default: true
    secrets:
      GPG_PRIVATE_KEY:
        required: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PROFILE: ${{ inputs.profile || 'standard' }}
      OFFLINE: ${{ inputs.offline || 'minimal' }}
    steps:
      - name: Free disk space (the build needs ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPGKEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build
        run: ./build.sh --container --profile "$PROFILE" --offline "$OFFLINE"
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            dist/*.iso
            checksums/
            metadata/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: build/repo/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aur-lock
          path: packages/aur.lock.json
          if-no-files-found: ignore

  qemu:
    needs: build
    if: ${{ inputs.qemu != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        scenario: [uefi-btrfs-encrypted, bios-ext4-grub]
    steps:
      - uses: actions/checkout@v4
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf xorriso
      - uses: actions/download-artifact@v4
        with:
          name: iso
      - name: Install and check (${{ matrix.scenario }})
        run: python3 tests/qemu/qemu_test.py --iso dist/*.iso --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-${{ matrix.scenario }}
          path: |
            build/qemu/**/*.log
            build/qemu/**/*.json
          if-no-files-found: ignore
