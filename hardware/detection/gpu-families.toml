"Redwood" = { family = "terascale", legacy = true }
"Cedar" = { family = "terascale", legacy = true }
"Barts" = { family = "terascale", legacy = true }
"Turks" = { family = "terascale", legacy = true }
"Caicos" = { family = "terascale", legacy = true }
"Cayman" = { family = "terascale", legacy = true }
"Wrestler" = { family = "terascale", legacy = true, integrated = true }
"Trinity" = { family = "terascale", legacy = true, integrated = true }
"Richland" = { family = "terascale", legacy = true, integrated = true }
"Sumo" = { family = "terascale", legacy = true, integrated = true }

# Targets for which PyTorch's ROCm wheels ship kernels, and targets that run
# them through HSA_OVERRIDE_GFX_VERSION.
[amd.rocm]
native = ["gfx900", "gfx906", "gfx908", "gfx90a", "gfx942", "gfx1030", "gfx1100", "gfx1101", "gfx1102", "gfx1151", "gfx1200", "gfx1201"]
[amd.rocm.override]
gfx1031 = "10.3.0"
gfx1032 = "10.3.0"
gfx1034 = "10.3.0"
gfx1035 = "10.3.0"
gfx1036 = "10.3.0"
gfx1103 = "11.0.0"
gfx1150 = "11.0.0"
gfx1152 = "11.0.0"

# --- Intel -------------------------------------------------------------------
# Regular expressions matched against the pci.ids name, first match wins.
[[intel.rules]]
match = "Battlemage|\\bArc B\\d{3}|\\bBMG\\b"
family = "xe2"
discrete = true
[[intel.rules]]
match = "\\bDG2\\b|Alchemist|\\bArc A\\d{3}|\\bArc Pro A"
family = "xe-hpg"
discrete = true
[[intel.rules]]
match = "\\bDG1\\b|Iris Xe MAX"
family = "xe-lp"
discrete = true
[[intel.rules]]
match = "Lunar Lake|Arrow Lake|Panther Lake|Arc Graphics 1[34]0V"
family = "xe2"
[[intel.rules]]
match = "Meteor Lake|Intel Arc Graphics"
family = "xe-lpg"
[[intel.rules]]
match = "Iris Xe|Alder Lake|Raptor Lake|Tiger ?Lake|Rocket Lake|Jasper Lake|Elkhart Lake|UHD Graphics 7\\d\\d|\\bGT[12] \\[UHD"
family = "xe-lp"
[[intel.rules]]
match = "Ice ?Lake|Iris Plus Graphics G[47]"
family = "gen11"
# Haswell and older need the legacy VA-API driver (i965).
[[intel.rules]]
match = "Sandy Bridge|Ivy Bridge|Haswell|2nd Generation Core|3rd Gen Core|4th Gen Core|Xeon E3-1200 v[23]|HD Graphics (2000|2500|3000|4000|4200|4400|4600|5000|5100|5200)\\b|Iris Pro Graphics 5200|Atom Processor Z36|Atom Processor Z37|Bay Trail|Valleyview"
family = "gen7"
legacy_vaapi = true
[[intel.rules]]
match = "GMA|Mobile 4 Series|G41|G45|Q45|Ironlake|Core Processor Integrated Graphics"
family = "gen5"
legacy_vaapi = true
[[intel.rules]]
match = ".*"
family = "gen9"
