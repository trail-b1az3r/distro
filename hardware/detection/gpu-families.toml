"Dali" = { family = "gcn5", gfx = "gfx902", integrated = true }
"Pollock" = { family = "gcn5", gfx = "gfx902", integrated = true }
"Renoir" = { family = "gcn5", gfx = "gfx90c", integrated = true }
"Lucienne" = { family = "gcn5", gfx = "gfx90c", integrated = true }
"Cezanne" = { family = "gcn5", gfx = "gfx90c", integrated = true }
