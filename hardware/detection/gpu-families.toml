# GPU generation tables used by distrokit.hardware.graphics.
#
# Names come from the PCI ID database (hwdata's pci.ids), which prefixes each
# device with its chip codename, for example "AD103 [GeForce RTX 4080 SUPER]"
# or "Navi 31 [Radeon RX 7900 XT/7900 XTX]". These tables map codenames to
# architectures. When a new GPU generation ships, add a row here; no code
# change is needed.

# --- NVIDIA ------------------------------------------------------------------
# Matched against the start of the codename, longest prefix first.
# branch: which driver stack supports the architecture (hardware/gpu/drivers.toml)
[nvidia.prefixes]
GB = { arch = "blackwell", branch = "open" }
GH = { arch = "hopper", branch = "open" }
AD = { arch = "ada", branch = "open" }
GA = { arch = "ampere", branch = "open" }
TU = { arch = "turing", branch = "open" }
GV = { arch = "volta", branch = "legacy580" }
GP = { arch = "pascal", branch = "legacy580" }
GM = { arch = "maxwell", branch = "legacy580" }
GK = { arch = "kepler", branch = "nouveau" }
GF = { arch = "fermi", branch = "nouveau" }
GT = { arch = "tesla", branch = "nouveau" }
G9 = { arch = "tesla", branch = "nouveau" }
G8 = { arch = "tesla", branch = "nouveau" }
C7 = { arch = "curie", branch = "nouveau" }
NV = { arch = "curie", branch = "nouveau" }

# When the codename is unknown, fall back to PCI device-ID ranges.
# Turing and every later generation use IDs from 0x1e00 upwards.
[nvidia.device_id_ranges]
open = [[0x1e00, 0xffff]]
legacy580 = [[0x1340, 0x1dff]]

# --- AMD ---------------------------------------------------------------------
# Matched as whole words against the pci.ids name (case-insensitive).
# gfx: the LLVM target, used to decide whether ROCm can run on the card.
# integrated: the name is an APU's graphics.
[amd.codenames]
"Navi 48" = { family = "rdna4", gfx = "gfx1201" }
"Navi 44" = { family = "rdna4", gfx = "gfx1200" }
"Navi 31" = { family = "rdna3", gfx = "gfx1100" }
"Navi 32" = { family = "rdna3", gfx = "gfx1101" }
"Navi 33" = { family = "rdna3", gfx = "gfx1102" }
"Strix Halo" = { family = "rdna3.5", gfx = "gfx1151", integrated = true }
"Strix" = { family = "rdna3.5", gfx = "gfx1150", integrated = true }
"Krackan" = { family = "rdna3.5", gfx = "gfx1152", integrated = true }
"Hawk Point" = { family = "rdna3", gfx = "gfx1103", integrated = true }
"Phoenix" = { family = "rdna3", gfx = "gfx1103", integrated = true }
"Phoenix1" = { family = "rdna3", gfx = "gfx1103", integrated = true }
"Phoenix2" = { family = "rdna3", gfx = "gfx1103", integrated = true }
"Phoenix3" = { family = "rdna3", gfx = "gfx1103", integrated = true }
"Navi 21" = { family = "rdna2", gfx = "gfx1030" }
"Navi 22" = { family = "rdna2", gfx = "gfx1031" }
"Navi 23" = { family = "rdna2", gfx = "gfx1032" }
"Navi 24" = { family = "rdna2", gfx = "gfx1034" }
"Rembrandt" = { family = "rdna2", gfx = "gfx1035", integrated = true }
"Van Gogh" = { family = "rdna2", gfx = "gfx1033", integrated = true }
"Mendocino" = { family = "rdna2", gfx = "gfx1037", integrated = true }
"Raphael" = { family = "rdna2", gfx = "gfx1036", integrated = true }
"Granite Ridge" = { family = "rdna2", gfx = "gfx1036", integrated = true }
