# Microsoft Surface support, built entirely from the distribution's fork of
# linux-surface (https://github.com/trail-b1az3r/linux-surface): the kernel from
# its pkg/arch/kernel, surface-contrib from its contrib/, and iptsd and
# libwacom-surface, all built by .github/workflows/surface.yml
# (scripts/build-surface.sh) into the [nexora-surface] repository. Nothing
# comes from linux-surface's own package server.
#
# Nothing here is installed unless the user enables the Surface kernel in the
# installer (it is pre-selected when Surface hardware is detected) or runs
# `<cli> surface enable`.

[repository]
name = "nexora-surface"
server = "https://github.com/trail-b1az3r/distro/releases/download/nexora-surface"
# Like the distribution's own repository, served over HTTPS from its GitHub
# releases, unsigned (docs/packaging.md).
siglevel = "Optional TrustAll"
# The repository the distribution used before; removed from pacman.conf when
# Surface support is enabled, so its packages are replaced by these.
replaces = ["linux-surface"]

# What [nexora-surface] is built from. Bump commit to take a newer fork.
[fork]
url = "https://github.com/trail-b1az3r/linux-surface"
commit = "6e5f9f95272c76faad61468e291f7a36e116e357"

[build]
# iptsd is in neither Arch nor the AUR: built from its repository at this tag.
iptsd_tag = "v3.1.1"

[packages]
kernel = ["linux-surface", "linux-surface-headers"]
# iptsd: touchscreen and pen (Intel Precise Touch). libwacom-surface: pen and
# touch device descriptions (replaces libwacom).
support = ["iptsd", "libwacom-surface", "touchd-dkms", "surface-contrib"]
# The IPU3 cameras (front, rear, IR) through the fork's surface-camd: published
# as webcams on v4l2loopback devices. Only on the models listed under [cameras].
cameras = ["v4l2loopback-dkms", "v4l-utils"]
# The kernel is not signed with linux-surface's MOK key: with Secure Boot on,
# it is signed on the machine with sbctl (the installer's Secure Boot option).
secureboot = []
# Marvell Wi-Fi firmware for older models.
marvell = ["linux-firmware-marvell"]

# Models whose firmware product name is ambiguous, by product SKU
# (/sys/class/dmi/id/product_sku). The 5th-generation Surface Pro (2017)
# reports itself as plain "Surface Pro".
[models]
"Surface_Pro_1796" = "Surface Pro (5th Gen)"
"Surface_Pro_1807" = "Surface Pro (5th Gen) LTE"
"Surface_Laptop" = "Surface Laptop"

# Product names (regular expressions) of models whose cameras are on an Intel
# IPU3 (OV5693 front, OV8865 rear, OV7251 IR), which surface-camd drives.
[cameras]
models = [
  "^Surface Pro [46]$",
  "^Surface Pro$",
  "^Surface Book$",
  "^Surface Book 2$",
]

# Product names (regular expressions) of models with Marvell Wi-Fi. Their Wi-Fi
# firmware (linux-firmware-marvell) is also installed with the regular kernel:
# the Wi-Fi card itself is detected (hardware/network.py).
[marvell]
models = [
  "^Surface Pro [3-6]$",
  "^Surface Pro$",
  "^Surface Book$",
  "^Surface Book 2$",
  "^Surface Laptop$",
  "^Surface Studio",
]
