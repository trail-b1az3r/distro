[package]
name = "frontline-msg-core"
version = "1.0.0"
edition = "2021"
description = "frontline-msg's message store: iPhone backups (sms.db, AddressBook) imported, messages kept, searched"
license = "MIT"
publish = false

[[bin]]
name = "frontline-msg-core"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
