[package]
name = "rdp-express"
version = "1.0.0"
edition = "2021"
description = "Frontline's remote desktop server: the Wayland desktop over an encrypted, low-latency protocol"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "rdp-express"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "mm", "shm", "event"] }
jpeg-encoder = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = true
strip = true
