# Curated local models offered by the installer and `<cli> model`.
#
# Every entry is a GGUF file on Hugging Face with its exact download size, so
# nothing is ever downloaded without showing what it costs first. Sizes were
# read from the Hub; the downloader verifies each file against the SHA-256 the
# Hub publishes for it.
#
# kv_gb_8k: approximate f16 KV-cache size for 8,192 tokens of context
# (2 x layers x kv_heads x head_dim x 2 bytes x 8192), used to estimate memory.
# hypernix_id: the name HyperNix's KNOWN_MODELS uses, where one exists.

[categories]
lightweight = { label = "Lightweight model", description = "Fast on any machine, including laptops without a GPU." }
general = { label = "General-purpose model", description = "Everyday chat, writing and summarising." }
coding = { label = "Coding model", description = "Code completion, explanation and refactoring." }
reasoning = { label = "Reasoning model", description = "Step-by-step problem solving; slower, more thorough answers." }
vision = { label = "Vision model", description = "Understands images as well as text." }

